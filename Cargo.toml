[workspace]
members = [
    "crates/sabiql",
    "crates/domain",
    "crates/app",
    "crates/infra",
    "crates/tui-kit",
    "crates/ui",
    "crates/sabiql-redis",
]
resolver = "2"

[workspace.package]
version = "1.12.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/sg004baa/sabiql"

[workspace.dependencies]
sabiql-domain = { path = "crates/domain", version = "1.12.0" }
sabiql-app = { path = "crates/app", version = "1.12.0" }
sabiql-infra = { path = "crates/infra", version = "1.12.0" }
sabiql-tui-kit = { path = "crates/tui-kit", version = "1.12.0" }
sabiql-ui = { path = "crates/ui", version = "1.12.0" }
arboard = "3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1"
dirs = "5"
dotenvy = "0.15"
futures = "0.3"
insta = "1"
lru = "0.16"
mockall = "0.13"
nucleo-matcher = "0.3"
walkdir = "2"
ratatui = "0.30"
rstest = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "rustls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "io-util", "process", "rt-multi-thread", "macros", "fs"] }
tokio-util = "0.7"
toml = "0.8"
unicode-casefold = "0.2"
unicode-width = "0.2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
